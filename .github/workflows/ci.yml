name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    # E2E tests need a real database. Same image and credentials as docker-compose.yml;
    # host port 5433 matches DATABASE_URL in apps/api/.env.example. The tests create
    # and seed their own `troofn_test` database inside it.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: troofn
          POSTGRES_PASSWORD: troofn
          POSTGRES_DB: troofn
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U troofn -d troofn"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Prepare env
        run: cp apps/api/.env.example apps/api/.env

      - name: Build shared
        run: pnpm build:shared

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test

      - name: API e2e tests
        run: pnpm test:e2e

      - name: Build apps
        run: pnpm build

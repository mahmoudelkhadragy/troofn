<!-- dir="ltr": the knob sits left when off and right when on, whatever the page direction. -->
<button
  type="button"
  role="switch"
  dir="ltr"
  class="flex h-[19px] w-9 shrink-0 cursor-pointer items-center rounded-full border-0 p-[2px] outline-none transition-colors focus-visible:ring-2 focus-visible:ring-gray-icon"
  [class]="checked() ? 'justify-end bg-brand' : 'justify-start bg-[#2e2e32]'"
  [attr.aria-checked]="checked()"
  [attr.aria-label]="label()"
  (click)="toggle()"
>
  <span class="size-[15px] rounded-full bg-white"></span>
</button>
